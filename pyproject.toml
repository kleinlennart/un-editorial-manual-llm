[project]
name = "unem"
version = "0.1.0"
description = "UN Editorial Manual for LLMs and AI agents: Markdown mirror, llms.txt, skill, Copilot kit, rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "pypdf>=5.0",
]

[project.scripts]
unem = "unem.cli:main"

[dependency-groups]
dev = [
    "llms-txt>=0.0.7",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
