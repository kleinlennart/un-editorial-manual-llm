name: Sync from un.org

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      # fetch → build → validate. A failure (blocked crawl, shrunken page, broken
      # links) still opens a *draft* PR when content changed, and fails the job.
      - id: sync
        run: uv run unem sync
        continue-on-error: true

      - name: PR body
        run: uv run unem pr-body > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/un-org
          delete-branch: true
          title: "Sync: upstream changes to the UN Editorial Manual"
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: "Sync from un.org"
          add-paths: |
            snapshots/html
            snapshots/crawl.json
            content
            manifest.json
            llms.txt
            llms-full.txt
            data/updates.json
          labels: sync
          draft: ${{ steps.sync.outcome == 'failure' }}

      - if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Sync or validation failed. Check the log above; if un.org blocks runners, run 'uv run unem sync' locally."
          exit 1
